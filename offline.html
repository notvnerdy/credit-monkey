<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Credit Monkey</title>
    <link rel="icon" type="image/png" href="/assets/images/logo.png">
    <style>
        :root {
            --primary-color: #0f2a4f;
            --secondary-color: #14b8a6;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fb 0%, #e2e8f0 100%);
            padding: 20px;
        }
        .offline-container {
            text-align: center;
            max-width: 500px;
            background: white;
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }
        .offline-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s ease-in-out infinite;
        }
        .offline-icon svg {
            width: 60px;
            height: 60px;
            fill: white;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        h1 {
            color: var(--primary-color);
            font-size: 1.75rem;
            margin-bottom: 1rem;
        }
        p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .retry-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .retry-btn:hover {
            background: #0d2241;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(15, 42, 79, 0.25);
        }
        .contact-info {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
        }
        .contact-info p {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        .contact-info a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.48L18.18 13.8 23.64 7zM17.04 15.22L3.27 1.44 2 2.72l2.05 2.06C1.91 5.76.59 6.82.36 7L12 21.5l3.07-3.9-.03-.03 1.77 1.77 1.27-1.27-1.04-1.04z"/>
            </svg>
        </div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Don't worry - once you're back online, you can continue exploring our credit repair services.</p>
        <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
        <div class="contact-info">
            <p>Need immediate assistance?</p>
            <p>Call us at <a href="tel:+18777017307">(877) 701-7307</a></p>
        </div>
    </div>
</body>
</html>
