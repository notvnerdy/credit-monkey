name: Deploy to Staging

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  STAGING_HOST: ${{ secrets.STAGING_HOST }}
  STAGING_USER: ${{ secrets.STAGING_USER }}
  STAGING_PATH: ${{ secrets.STAGING_PATH }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github-actions
          chmod 600 ~/.ssh/github-actions
          ssh-keyscan -H ${{ env.STAGING_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          
      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/github-actions -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} \
            "echo 'SSH connection test successful' && whoami && pwd"
      
      - name: Validate HTML
        run: |
          echo "Skipping HTML validation for now"
        continue-on-error: true
      
      - name: Deploy to staging
        run: |
          echo "Deploying to: ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }}:${{ env.STAGING_PATH }}/"
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.ssh-github' \
            --exclude='.ssh-github.pub' \
            --exclude='*.bak' \
            --exclude='node_modules' \
            -e "ssh -i ~/.ssh/github-actions -o StrictHostKeyChecking=no" \
            ./ ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }}:${{ env.STAGING_PATH }}/
          echo "Deployment completed"
      
      - naecho "Checking deployment path: ${{ env.STAGING_PATH }}"
          ssh -i ~/.ssh/github-actions ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} \
            "ls -la ${{ env.STAGING_PATH }} && echo '---' && echo 'File count:' && find ${{ env.STAGING_PATH }} -type f | wc -l && echo 'Deployment verified
          ssh -i ~/.ssh/github-actions ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} \
            "ls -la ${{ env.STAGING_PATH }} && echo 'Deployment successful'"
      
      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Successfully deployed to staging: stg.creditvana.com"
      
      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed"
          exit 1
