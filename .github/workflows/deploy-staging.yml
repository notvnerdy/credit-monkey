name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  STAGING_HOST: ${{ secrets.STAGING_HOST }}
  STAGING_USER: ${{ secrets.STAGING_USER }}
  STAGING_PATH: ${{ secrets.STAGING_PATH }}

jobs:
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          shopt -s nullglob
          for file in *.html states/*.html; do
            echo "Checking $file"
            grep -q "<!DOCTYPE html>" "$file" || echo "⚠️ Missing DOCTYPE: $file"
            grep -q "</html>" "$file" || exit 1
          done
          echo "✅ HTML validation passed"

      - name: Check for sensitive data
        run: |
          echo "🔍 Checking for exposed secrets..."
          if grep -r -i "password\|api[_-]key\|secret" --include="*.html" --include="*.js" --include="*.css" .; then
            echo "⚠️  Warning: Potential sensitive data found"
          else
            echo "✅ No sensitive data detected"
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Security audit
        run: |
          echo "🔒 Running security checks..."
          grep -r "javascript:" --include="*.html" . || true
          grep -r "<script src=" --include="*.html" . || true
          echo "✅ Security scan completed"

  build:
    name: Build & Optimize
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Optimize assets
        run: |
          echo "🔨 Building and optimizing assets..."
          mkdir -p build
          cp -r *.html assets states robots.txt CNAME build/ 2>/dev/null || true
          cp -r backend build/ 2>/dev/null || true
          echo "✅ Build completed"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: build/
          retention-days: 1

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.STAGING_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy via rsync
        run: |
          echo "🚀 Deploying to staging..."
          rsync -avz \
            --exclude='.git' --exclude='.github' --exclude='backend/.env' --exclude='*.bak' --exclude='node_modules' --exclude='vendor' --exclude='backend/storage/logs/*' --exclude='backend/database/database.sqlite' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            build/ ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }}:${{ env.STAGING_PATH }}/
          echo "✅ Files deployed successfully"

      - name: Setup backend environment
        run: |
          echo "⚙️ Setting up backend environment..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} << 'EOF'
            cd ${{ env.STAGING_PATH }}/backend
            # Copy production env if .env doesn't exist
            [ ! -f .env ] && cp .env.production .env || echo ".env already exists"
            # Install composer dependencies
            composer install --no-dev --optimize-autoloader 2>/dev/null || echo "Composer not available, skipping"
            # Set permissions
            chmod -R 755 storage bootstrap/cache
            chmod -R 777 storage/logs storage/framework
            echo "✅ Backend environment configured"
          EOF

      - name: Clear server cache
        run: |
          echo "🧹 Clearing server cache..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} \
            "cd ${{ env.STAGING_PATH }} && find . -name '.cache' -type d -exec rm -rf {} + 2>/dev/null || true && echo '✅ Cache cleared'"

      - name: Run Laravel migrations
        run: |
          echo "🗄️ Running Laravel migrations..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} \
            "cd ${{ env.STAGING_PATH }}/backend && php artisan migrate --force"

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} \
            "cd ${{ env.STAGING_PATH }} && ls -lh index.html && echo '✅ Deployment verified'"

      - name: Deployment summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🌐 Website: https://creditmonkey.com"
          echo "📦 Deployed to: ${{ env.STAGING_PATH }}"
          echo "🕐 Time: $(date)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
