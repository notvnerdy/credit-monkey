name: Deploy Frontend to creditmonkey.com

on:
  push:
    branches:
      - frontend

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

env:
  SERVER_HOST: ${{ secrets.STAGING_HOST }}
  SERVER_USER: ${{ secrets.STAGING_USER }}
  FRONTEND_PATH: /home4/dionros/public_html

jobs:
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          shopt -s nullglob
          for file in *.html states/*.html; do
            echo "Checking $file"
            grep -q "<!DOCTYPE html>" "$file" || echo "⚠️ Missing DOCTYPE: $file"
            grep -q "</html>" "$file" || exit 1
          done
          echo "✅ HTML validation passed"

      - name: Check for sensitive data
        run: |
          echo "🔍 Checking for exposed secrets..."
          if grep -r -i "password\|api[_-]key\|secret" --include="*.html" --include="*.js" --include="*.css" .; then
            echo "⚠️  Warning: Potential sensitive data found"
          else
            echo "✅ No sensitive data detected"
          fi

  deploy:
    name: Deploy Frontend Files
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Frontend to Server
        run: |
          echo "🚀 Deploying frontend to creditmonkey.com..."
          
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='backend/' \
            --exclude='*.md' \
            --exclude='*.py' \
            --exclude='*.sh' \
            --exclude='node_modules' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.FRONTEND_PATH }}/
          
          echo "✅ Frontend deployed successfully!"

      - name: Verify Deployment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} \
            "ls -la ${{ env.FRONTEND_PATH }} | head -10"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Notify Success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Frontend deployed successfully to https://creditmonkey.com"
          echo "Deployment completed at $(date)"

      - name: Notify Failure
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ Frontend deployment failed"
          exit 1
